name: MLSecOps Automated CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  security-and-lint:
    name: Security Scans & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r src/ api/ -f txt

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit --progress-spinner off || echo "Vulnerability warnings logged"

  unit-and-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: security-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Test Suite
        run: |
          pytest -o addopts="" -v

  benchmark-and-evaluation:
    name: 3-Way Benchmark & DEA Evaluation
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Execute 3-Way Comparison Experiment
        run: |
          python -m experiments.run_comparison

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlsecops-benchmark-report
          path: results/
